<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - J.D. Youngster Enterprise</title>
    <meta name="description" content="View your transaction history.">
    <link rel="stylesheet" href="transactions.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
            <div class="sidebar-title" id="sidebarTitle">J.D Youngster Enterprise</div>
            <div class="brand-logo" id="sidebarLogo">
                <img src="WhatsApp Image 2026-01-31 at 4.07.11 PM.jpeg" alt="Store Logo">
            </div>
        </div>
        <script>
            (function() {
                var name = localStorage.getItem('storeBrandName');
                var logo = localStorage.getItem('storeBrandLogo');
                if (name) {
                    var t = document.getElementById('sidebarTitle');
                    if (t) t.textContent = name;
                    document.title = name + ' — Transactions';
                }
                if (logo || name) {
                    var l = document.getElementById('sidebarLogo');
                    if (l) {
                        if (logo) {
                            l.innerHTML = '<img src="' + logo + '" alt="' + (name || '') + ' Logo" style="width:100%;height:100%;object-fit:contain;border-radius:6px;">';
                        } else {
                            l.innerHTML = '<span style="font-size:18px;font-weight:700;color:#6a11cb;width:100%;height:100%;display:flex;align-items:center;justify-content:center;">' + name.charAt(0).toUpperCase() + '</span>';
                        }
                    }
                }
            })();
        </script>
        <ul class="menu">
            <!-- Dashboard — carries ?store= so guests keep their store context -->
            <a href="../dashboard2.html" class="menu-item" id="dashboardMenuLink">
                <i class="fas fa-tachometer-alt"></i>
                <span class="menu-text">Dashboard</span>
            </a>

            <a href="../Orders/new_orders.html" class="menu-item">
                <i class="fas fa-shopping-cart"></i>
                <span class="menu-text">Orders</span>
            </a>

            <!-- Transactions — active -->
            <a href="#" class="menu-item active">
                <i class="fas fa-exchange-alt"></i>
                <span class="menu-text">Transactions</span>
            </a>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="orders-container">
            <div class="orders-header">
                <div class="header-left">
                    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="header-title-section">
                        <div class="header-title-text">
                            <h1 class="header-orders-title">Transactions</h1>
                            <p class="header-orders-subtitle">View all transactions here</p>
                        </div>
                    </div>
                </div>
                <div class="search-container">
                    <button class="search-btn" id="searchBtn" aria-label="Search">
                        <i class="fas fa-search"></i>
                    </button>
                    <div class="search-bar" id="searchBar">
                        <input type="text" class="search-input" placeholder="Search transactions...">
                    </div>
                </div>
            </div>

            <div class="orders-content">
                <div class="table-header">
                    <div class="table-title-section">
                        <div class="orders-icon">
                            <i class="fas fa-list"></i>
                        </div>
                        <div class="title-text">
                            <h1 class="orders-title">Transaction History</h1>
                            <p class="orders-subtitle">Recent transactions and their status</p>
                        </div>
                    </div>
                    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <!-- Desktop Table — populated by transactions.js -->
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>NUMBER</th>
                            <th>DESCRIPTION</th>
                            <th>AMOUNT</th>
                            <th>METHOD</th>
                            <th>DATE</th>
                            <th>STATUS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by transactions.js -->
                    </tbody>
                </table>

                <!-- Mobile Cards — populated by transactions.js -->
                <div class="mobile-cards"></div>
            </div>
        </div>
    </div>

    <script src="transactions.js"></script>
</body>
</html>
