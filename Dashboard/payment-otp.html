<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Payment OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.10);
            text-align: center;
        }

        .icon-wrap {
            width: 70px; height: 70px;
            background: #fff3e0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px; color: #f57c00;
        }

        h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 8px; }

        .sub {
            color: #666; font-size: 14px; line-height: 1.6;
            margin-bottom: 28px;
        }
        .sub strong { color: #333; }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-inputs input {
            width: 48px; height: 56px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 22px; font-weight: 700;
            text-align: center;
            color: #1a1a2e;
            outline: none;
            transition: border-color 0.2s;
        }
        .otp-inputs input:focus { border-color: #6200ff; }
        .otp-inputs input.filled { border-color: #6200ff; background: #f3eeff; }

        .timer {
            font-size: 13px; color: #999;
            margin-bottom: 20px;
        }
        .timer span { color: #e53935; font-weight: 600; }

        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #6200ff, #4500b3);
            color: white; border: none;
            border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:not(:disabled):hover { opacity: 0.9; }

        .resend {
            margin-top: 16px; font-size: 13px; color: #999;
        }
        .resend button {
            background: none; border: none;
            color: #6200ff; font-weight: 600;
            cursor: pointer; font-size: 13px;
        }
        .resend button:disabled { color: #ccc; cursor: not-allowed; }

        .status-msg {
            margin-top: 16px; padding: 12px 16px;
            border-radius: 8px; font-size: 14px;
            display: none;
        }
        .status-msg.error   { background: #fdecea; color: #c62828; display: block; }
        .status-msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status-msg.loading { background: #e3f2fd; color: #1565c0; display: block; }

        .spinner { display: inline-block; width: 16px; height: 16px;
            border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-wrap"><i class="fas fa-shield-alt"></i></div>
    <h1>Enter OTP</h1>
    <p class="sub">
        An OTP has been sent to <strong id="phoneDisplay">your phone</strong> via SMS.<br>
        Enter it below to authorise the payment.
    </p>

    <div class="otp-inputs" id="otpInputs">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>

    <div class="timer">OTP expires in <span id="countdown">05:00</span></div>

    <button class="btn" id="submitBtn" disabled onclick="submitOtp()">
        Verify & Pay
    </button>

    <div class="resend">
        Didn't receive it?
        <button id="resendBtn" disabled onclick="resendOtp()">Resend OTP</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    // ── Read context from URL params (set by the payment initiation flow) ────
    const params        = new URLSearchParams(window.location.search);
    const transactionId = params.get('txid')   || '';
    const phoneNumber   = params.get('phone')  || '';
    const returnUrl     = params.get('return') || '/';
    const API_BASE = 'https://youngster-backend-production.up.railway.app';

    document.getElementById('phoneDisplay').textContent =
        phoneNumber ? phoneNumber.replace(/(\d{3})\d{4}(\d{3})/, '$1****$2') : 'your phone';

    // ── OTP inputs: auto-advance and auto-submit ──────────────────────────────
    const inputs   = Array.from(document.querySelectorAll('.otp-inputs input'));
    const submitBtn = document.getElementById('submitBtn');

    inputs.forEach((inp, i) => {
        inp.addEventListener('input', () => {
            inp.value = inp.value.replace(/\D/g, '');
            if (inp.value) {
                inp.classList.add('filled');
                if (i < inputs.length - 1) inputs[i + 1].focus();
            } else {
                inp.classList.remove('filled');
            }
            checkReady();
        });

        inp.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !inp.value && i > 0) {
                inputs[i - 1].value = '';
                inputs[i - 1].classList.remove('filled');
                inputs[i - 1].focus();
                checkReady();
            }
        });

        // Handle paste of full OTP code
        inp.addEventListener('paste', e => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData)
                .getData('text').replace(/\D/g, '').slice(0, 6);
            pasted.split('').forEach((ch, idx) => {
                if (inputs[idx]) {
                    inputs[idx].value = ch;
                    inputs[idx].classList.add('filled');
                }
            });
            const next = inputs[Math.min(pasted.length, inputs.length - 1)];
            next.focus();
            checkReady();
        });
    });

    function getOtpValue() {
        return inputs.map(i => i.value).join('');
    }

    function checkReady() {
        submitBtn.disabled = getOtpValue().length < 6;
    }

    inputs[0].focus();

    // ── Countdown timer ───────────────────────────────────────────────────────
    let secondsLeft  = 5 * 60; // 5 minutes
    let resendAllowed = false;
    const countdownEl = document.getElementById('countdown');
    const resendBtn   = document.getElementById('resendBtn');

    const timer = setInterval(() => {
        secondsLeft--;
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
        const s = String(secondsLeft % 60).padStart(2, '0');
        countdownEl.textContent = `${m}:${s}`;

        if (secondsLeft <= 60 && !resendAllowed) {
            resendAllowed = true;
            resendBtn.disabled = false;
        }
        if (secondsLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = 'Expired';
            submitBtn.disabled = true;
            showStatus('error', 'OTP has expired. Please request a new one.');
        }
    }, 1000);

    // ── Submit OTP ────────────────────────────────────────────────────────────
    let _otpSubmitting = false;   // guard against double-tap / duplicate calls

    async function submitOtp() {
        const otp = getOtpValue();
        if (otp.length < 6) return;
        if (_otpSubmitting) return;   // already in flight — ignore
        _otpSubmitting = true;

        submitBtn.disabled = true;
        showStatus('loading', '<span class="spinner"></span> Verifying OTP…');

        try {
            // Use AbortController with a 60-second timeout — the backend makes two
            // sequential calls to Moolre (OTP verify + USSD push) which can take 20–40 s.
            const controller = new AbortController();
            const fetchTimeout = setTimeout(() => controller.abort(), 60000);

            let res, data;
            try {
                res  = await fetch(`${API_BASE}/api/payment/verify-otp`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ transactionId, otpCode: otp }),
                    signal:  controller.signal,
                });
                data = await res.json();
            } catch (fetchErr) {
                // If the fetch timed out or the network dropped AFTER the server likely
                // processed the OTP (i.e. we waited > 30 s), treat it as a soft success
                // and drop straight into the polling screen — the USSD prompt may have
                // already been sent.
                if (fetchErr.name === 'AbortError' || fetchErr.message?.includes('network')) {
                    data = { success: true, _fromTimeout: true,
                             message: 'Connection took too long — checking payment status…' };
                } else {
                    throw fetchErr;
                }
            } finally {
                clearTimeout(fetchTimeout);
            }

            if (data.success) {
                clearInterval(timer);

                // Replace card with waiting screen — no redirect needed
                document.querySelector('.card').innerHTML = `
                    <div style="text-align:center;padding:10px 0;">
                        <div style="width:70px;height:70px;
                            background:linear-gradient(135deg,#6a11cb,#2575fc);
                            border-radius:50%;display:flex;align-items:center;
                            justify-content:center;margin:0 auto 20px;">
                            <i class="fas fa-mobile-alt" style="color:#fff;font-size:28px;"></i>
                        </div>
                        <h1 style="font-size:20px;color:#1a1a2e;margin-bottom:8px;">
                            Check Your Phone
                        </h1>
                        <p style="color:#666;font-size:14px;line-height:1.6;margin-bottom:28px;">
                            A payment prompt has been sent to your phone.<br>
                            Enter your <strong>MoMo PIN</strong> to approve the payment.
                        </p>
                        <div id="waitSpinner" style="margin-bottom:12px;">
                            <i class="fas fa-spinner fa-spin"
                                style="font-size:36px;color:#6a11cb;"></i>
                        </div>
                        <p id="waitMsg" style="color:#999;font-size:13px;margin-bottom:24px;">
                            Waiting for your approval…
                        </p>
                        <div id="waitResult" style="display:none;"></div>
                        <button onclick="window.location.href='${returnUrl}'"
                            style="margin-top:8px;padding:10px 24px;background:transparent;
                            color:#e74c3c;border:1px solid #e74c3c;border-radius:8px;
                            font-size:13px;cursor:pointer;">
                            Cancel
                        </button>
                    </div>`;

                // Poll for payment status after OTP verification.
                //
                // Moolre won't register the transaction in its status system until
                // the customer responds to the USSD PIN prompt — which typically
                // takes 15–120 seconds.  Polling too early just produces a flood of
                // SS07 "Transaction not found" responses.
                //
                // Strategy:
                //   • Wait 15 s before the very first check (skip guaranteed-SS07 calls)
                //   • Poll every 10 s for the first 2 minutes
                //   • Poll every 15 s thereafter (customer is slow / distracted)
                //   • Give up after 4 minutes total
                const API_BACKEND = API_BASE;
                let pollCount   = 0;
                let elapsedSecs = 0;
                const DEADLINE_SECS = 240; // 4 minutes total

                const updateWaitMsg = (secs) => {
                    const el = document.getElementById('waitMsg');
                    if (!el) return;
                    if (secs < 15) {
                        el.textContent = 'Sending payment prompt to your phone…';
                    } else if (secs < 60) {
                        el.textContent = 'A USSD prompt has been sent. Dial the PIN on your phone to approve.';
                    } else {
                        el.textContent = `Still waiting for your approval… (${secs}s)`;
                    }
                };

                // Tick the elapsed-seconds counter every second for the status message
                const tickTimer = setInterval(() => {
                    elapsedSecs++;
                    updateWaitMsg(elapsedSecs);
                }, 1000);

                const doPoll = async () => {
                    pollCount++;
                    try {
                        const r      = await fetch(`${API_BACKEND}/api/payment/status/${transactionId}`);
                        const d      = await r.json();
                        const status = (d.status || d.transaction?.status || 'pending').toLowerCase();

                        if (status === 'success' || status === 'completed') {
                            clearInterval(tickTimer);
                            document.getElementById('waitSpinner').style.display = 'none';
                            document.getElementById('waitMsg').style.display     = 'none';
                            document.getElementById('waitResult').style.display  = 'block';
                            document.getElementById('waitResult').innerHTML = `
                                <div style="background:#e8f5e9;border-radius:12px;padding:20px;margin-bottom:16px;">
                                    <div style="font-size:48px;margin-bottom:8px;">✅</div>
                                    <h2 style="color:#2e7d32;margin:0 0 8px;font-size:18px;">
                                        Payment Successful!
                                    </h2>
                                    <p style="color:#555;font-size:13px;margin:0;">
                                        Your bundle order has been placed.
                                    </p>
                                </div>
                                <button onclick="window.location.href='${returnUrl}'"
                                    style="width:100%;padding:14px;background:linear-gradient(135deg,#6a11cb,#2575fc);
                                    color:#fff;border:none;border-radius:10px;font-size:15px;
                                    font-weight:600;cursor:pointer;">
                                    Done
                                </button>`;
                            return; // stop scheduling further polls

                        } else if (status === 'failed' || status === 'cancelled') {
                            clearInterval(tickTimer);
                            document.getElementById('waitSpinner').style.display = 'none';
                            document.getElementById('waitMsg').style.display     = 'none';
                            document.getElementById('waitResult').style.display  = 'block';
                            document.getElementById('waitResult').innerHTML = `
                                <div style="background:#fdecea;border-radius:12px;padding:20px;margin-bottom:16px;">
                                    <div style="font-size:48px;margin-bottom:8px;">❌</div>
                                    <h2 style="color:#c62828;margin:0 0 8px;font-size:18px;">
                                        Payment Failed
                                    </h2>
                                    <p style="color:#555;font-size:13px;margin:0;">
                                        The payment was not completed. Please try again.
                                    </p>
                                </div>
                                <button onclick="window.location.href='${returnUrl}'"
                                    style="width:100%;padding:14px;background:#c62828;
                                    color:#fff;border:none;border-radius:10px;font-size:15px;
                                    font-weight:600;cursor:pointer;">
                                    Try Again
                                </button>`;
                            return; // stop scheduling further polls
                        }

                        // Still pending — schedule next poll if within deadline
                        if (elapsedSecs >= DEADLINE_SECS) {
                            clearInterval(tickTimer);
                            const msgEl = document.getElementById('waitMsg');
                            if (msgEl) msgEl.textContent =
                                'Timed out. If you approved the payment, please contact support.';
                            return;
                        }

                        // Adaptive interval: 10 s for first 2 min, then 15 s
                        const nextInterval = elapsedSecs < 120 ? 10000 : 15000;
                        setTimeout(doPoll, nextInterval);

                    } catch (e) {
                        console.warn('Poll error:', e);
                        // Network hiccup — retry after 10 s
                        if (elapsedSecs < DEADLINE_SECS) setTimeout(doPoll, 10000);
                    }
                };

                // First poll after 15 s — gives Moolre time to register the transaction
                setTimeout(doPoll, 15000);

            } else {
                showStatus('error', data.message || 'OTP verification failed. Please try again.');
                inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                inputs[0].focus();
                checkReady();
                submitBtn.disabled = false;
                _otpSubmitting = false;
            }
        } catch (err) {
            showStatus('error', 'Network error. Please try again.');
            submitBtn.disabled = false;
            _otpSubmitting = false;
        }
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !submitBtn.disabled) submitOtp();
    });

    // ── Resend OTP ────────────────────────────────────────────────────────────
    async function resendOtp() {
        resendBtn.disabled = true;
        showStatus('loading', '<span class="spinner"></span> Resending OTP…');

        try {
            const res  = await fetch(`${API_BASE}/api/payment/resend-otp`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ transactionId }),
            });
            const data = await res.json();

            if (data.success) {
                showStatus('success', 'A new OTP has been sent. Please check your SMS.');
                // Reset the countdown to give a fresh 5-minute window
                secondsLeft   = 5 * 60;
                resendAllowed = false;
                resendBtn.disabled = true;  // will re-enable when countdown reaches 60s
                submitBtn.disabled = false;
                // Clear inputs so the customer can type the new code
                inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
                inputs[0].focus();
                checkReady();
            } else {
                showStatus('error', data.message || 'Could not resend OTP. Please try again.');
                resendBtn.disabled = false;
            }
        } catch {
            showStatus('error', 'Network error. Could not resend OTP. Please try again.');
            resendBtn.disabled = false;
        }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showStatus(type, html) {
        const el = document.getElementById('statusMsg');
        el.className = `status-msg ${type}`;
        el.innerHTML = html;
    }
</script>
</body>
</html>
