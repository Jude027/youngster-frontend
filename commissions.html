<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Commission History - Youngster Data Shop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../Dashboard/dashboard.css">

<style>
/* Prevent dashboard elements from expanding beyond the viewport */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow-x: clip;
}

.main-container {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  margin-left: 0 !important;
}

.header {
  min-width: 0;
  max-width: 100%;
  flex-wrap: wrap;
  gap: 12px;
}

.header-left,
.header-title,
.header-right {
  min-width: 0;
}

.header-title {
  overflow-wrap: anywhere;
}

.header-title h1 {
  font-size: clamp(20px, 4vw, 30px);
  overflow-wrap: anywhere;
}

.commission-wrap {
  width: 100%;
  max-width: 1200px;
  min-width: 0;
  margin: 0 auto;
  padding: 22px;
}

.commission-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}

.commission-head h2 {
  margin-top: 0;
  overflow-wrap: anywhere;
}

.commission-note {
  color: #666;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

/* Responsive summary cards */
#commissionSummary.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  width: 100%;
  margin-top: 18px;
}

#commissionSummary .stat-card {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

#commissionSummary .stat-info {
  min-width: 0;
}

#commissionSummary .stat-info h3 {
  font-size: clamp(16px, 2vw, 24px);
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Desktop table: scrolling is confined to this wrapper */
.commission-table-wrap {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  background: #fff;
  border-radius: 10px;
  margin-top: 18px;
}

.commission-table {
  width: 100%;
  min-width: 1000px;
  border-collapse: collapse;
  font-size: 13px;
}

.commission-table th,
.commission-table td {
  padding: 11px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

.commission-table th {
  background: #f5f5f5;
}

.commission-status {
  display: inline-block;
  max-width: 100%;
  border-radius: 20px;
  padding: 4px 9px;
  background: #f3f4f6;
  color: #374151;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.commission-error {
  padding: 14px;
  background: #fff7ed;
  color: #9a3412;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

/* Tablet */
@media (max-width: 900px) {
  .commission-wrap {
    padding: 18px;
  }

  #commissionSummary.stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
}

/* Mobile: turn each table row into a readable card */
@media (max-width: 600px) {
  .commission-wrap {
    padding: 12px;
  }

  .header {
    padding-left: 12px;
    padding-right: 12px;
  }

  .header-title {
    flex: 1 1 auto;
    order: 0;
    min-width: 0;
    text-align: center;
  }

  .header-left {
    flex: 1 1 auto;
  }

  .header-right {
    flex: 0 0 auto;
  }

  #commissionSummary.stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  #commissionSummary .stat-card {
    padding: 12px;
  }

  .commission-table-wrap {
    overflow: visible;
    background: transparent;
    border-radius: 0;
  }

  .commission-table {
    display: block;
    width: 100%;
    min-width: 0;
    border-collapse: separate;
  }

  .commission-table thead {
    display: none;
  }

  .commission-table tbody {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    width: 100%;
  }

  .commission-table tr {
    display: block;
    min-width: 0;
    width: 100%;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
  }

  .commission-table td {
    display: grid;
    grid-template-columns: minmax(100px, 0.85fr) minmax(0, 1.15fr);
    align-items: start;
    gap: 10px;
    width: 100%;
    min-width: 0;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .commission-table td:last-child {
    border-bottom: 0;
  }

  .commission-table td::before {
    content: attr(data-label);
    font-weight: 600;
    color: #555;
    overflow-wrap: anywhere;
  }

  .commission-table td > * {
    min-width: 0;
    max-width: 100%;
  }
}

@media (max-width: 360px) {
  .commission-table td {
    grid-template-columns: minmax(0, 1fr);
    gap: 5px;
  }
}


/* ===== Commission page visual polish ===== */

body {
  background: #f4f6fb;
  color: #202938;
}

.commission-wrap {
  padding-top: 20px;
  padding-bottom: 32px;
}

.commission-head {
  margin-bottom: 18px;
}

.commission-head h2 {
  margin-bottom: 8px;
  color: #182230;
  font-size: clamp(22px, 4vw, 28px);
  font-weight: 750;
  letter-spacing: -0.4px;
}

.commission-note {
  color: #687386;
  font-size: 13px;
  line-height: 1.6;
}

/* Summary cards */
#commissionSummary.stats-grid {
  gap: 12px;
  margin-top: 20px;
}

#commissionSummary .stat-card {
  display: flex;
  align-items: center;
  min-height: 94px;
  padding: 17px;
  background: #fff;
  border: 1px solid #e7eaf1;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(25, 40, 70, 0.045);
  transition: box-shadow 0.2s ease;
}

#commissionSummary .stat-info h3 {
  margin: 0 0 6px;
  color: #243b75;
  font-weight: 750;
  letter-spacing: -0.3px;
}

#commissionSummary .stat-info p {
  margin: 0;
  color: #687386;
  font-size: 13px;
}

/* Make the record area feel like a dashboard panel */
#commissionMessage {
  margin-top: 22px !important;
  margin-bottom: 14px;
}

.commission-table-wrap {
  background: transparent;
  border-radius: 14px;
  margin-top: 14px;
}

/* Vertical commission records */
.commission-table tr {
  background: #fff;
  border: 1px solid #e5e9f2;
  border-radius: 15px;
  box-shadow: 0 5px 18px rgba(25, 40, 70, 0.055);
  transition: box-shadow 0.2s ease;
}

.commission-table td {
  color: #344054;
  line-height: 1.5;
}

.commission-table td::before {
  color: #586579;
  font-size: 13px;
  font-weight: 700;
}

.commission-table td[data-label="Commission"] {
  color: #176b45;
  font-weight: 750;
}

.commission-status {
  width: fit-content;
  background: #e9f7ef;
  color: #176b45;
  font-weight: 650;
  padding: 5px 11px;
}

/* Keep long IDs and descriptions from stretching the page */
.commission-table td {
  overflow-wrap: anywhere;
  word-break: normal;
}

.commission-table td[data-label="Order ID"],
.commission-table td[data-label="Payment ID"] {
  word-break: break-word;
}

/* Reduce the height of the header without moving the title
   onto an unnecessarily low row */
.header {
  padding-top: 12px;
  padding-bottom: 12px;
  row-gap: 6px;
}

.header-title {
  margin-top: 0;
  margin-bottom: 0;
}

.header-title h1 {
  margin-top: 0;
  margin-bottom: 4px;
}

.header-title .subtitle {
  margin-top: 0;
  margin-bottom: 0;
}

/* Mobile refinements */
@media (max-width: 600px) {
  .commission-wrap {
    padding: 14px 12px 26px;
  }

  .commission-head h2 {
    margin-bottom: 5px;
  }

  #commissionSummary.stats-grid {
    gap: 10px;
    margin-top: 16px;
  }

  #commissionSummary .stat-card {
    min-height: 82px;
    padding: 13px 12px;
    border-radius: 12px;
  }

  #commissionSummary .stat-info h3 {
    font-size: clamp(15px, 4vw, 20px);
  }

  #commissionSummary .stat-info p {
    font-size: 12px;
  }

  .commission-table tbody {
    gap: 12px;
  }

  .commission-table tr {
    padding: 7px 13px;
    border-radius: 14px;
  }

  .commission-table td {
    padding: 11px 0;
    font-size: 13px;
  }

  .header {
    padding-top: 8px;
    padding-bottom: 10px;
    row-gap: 4px;
  }

  .header-title h1 {
    font-size: 23px;
    line-height: 1.2;
  }

  .header-title .subtitle {
    font-size: 13px;
    line-height: 1.4;
  }
}


/* Restore the original horizontal commission table */
.commission-table-wrap {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto !important;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  margin-top: 18px;
}

.commission-table {
  display: table !important;
  width: max-content !important;
  min-width: 1000px !important;
  border-collapse: collapse !important;
  font-size: 13px;
}

.commission-table thead {
  display: table-header-group !important;
}

.commission-table tbody {
  display: table-row-group !important;
  width: auto !important;
}

.commission-table tr {
  display: table-row !important;
  width: auto !important;
  min-width: 0 !important;
  padding: 0 !important;
  background: #fff;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}

.commission-table th,
.commission-table td {
  display: table-cell !important;
  width: auto;
  min-width: 0;
  padding: 12px 14px !important;
  border-bottom: 1px solid #eee !important;
  text-align: left;
  vertical-align: middle;
  white-space: nowrap !important;
}

.commission-table th {
  background: #f3f4f8 !important;
  color: #344054;
  font-weight: 700;
}

.commission-table td::before {
  content: none !important;
  display: none !important;
}

/* Keep the table inside the screen on mobile */
@media (max-width: 600px) {
  .commission-table-wrap {
    overflow-x: auto !important;
    border-radius: 8px;
  }

  .commission-table {
    min-width: 1000px !important;
  }

  .commission-table th,
  .commission-table td {
    padding: 11px 12px !important;
  }
}

</style>

</head>
<body>
<div class="main-container" style="margin-left:0;">
  <div class="header">
    <div class="header-left"><a href="../Referral links/dealers_referral_program.html" style="text-decoration:none;color:inherit;"><i class="fas fa-arrow-left"></i> Back</a></div>
    <div class="header-title"><h1>My Commission History</h1><p class="subtitle">Your private, read-only commission ledger</p></div>
    <div class="header-right"><button id="refreshCommissions" class="theme-toggle" title="Refresh"><i class="fas fa-sync-alt"></i></button></div>
  </div>
  <main class="commission-wrap">
    <div class="commission-head">
      <div><h2>Commission records</h2><p class="commission-note">Only your own records are shown. Older entries may not contain all order-time details; unavailable values are not guessed.</p></div>
    </div>
    <div id="commissionSummary" class="stats-grid"></div>
    <div id="commissionMessage" class="commission-note" style="margin-top:14px;">Loading your commission history...</div>
    <div id="commissionTable" class="commission-table-wrap"></div>
  </main>
</div>

<script>
const COMMISSION_API = 'https://youngster-backend.vercel.app/api';
const commissionToken = localStorage.getItem('token');

const esc = v =>
  String(v === undefined || v === null || v === '' ? 'Unavailable' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

const money = v =>
  v === undefined || v === null || v === '' ||
  !Number.isFinite(Number(v))
    ? 'Unavailable'
    : 'GHS ' + Number(v).toFixed(2);

async function loadMyCommissions() {
  console.log('Commission history script started');
  const msg = document.getElementById('commissionMessage');
  const table = document.getElementById('commissionTable');
  const summary = document.getElementById('commissionSummary');

  if (!commissionToken) {
    msg.innerHTML =
      '<div class="commission-error">Please log in to view your commission history.</div>';
    table.innerHTML = '';
    summary.innerHTML = '';
    return;
  }

  msg.textContent = 'Loading your commission history...';
  table.innerHTML = '';

  try {
    
    const headers = {
      Authorization: `Bearer ${commissionToken}`,
      Accept: 'application/json'
    };
    
    const [res, withdrawalRes] = await Promise.all([
      console.log('About to fetch commission and withdrawal records');
      fetch(`${COMMISSION_API}/commissions/my?limit=250`, {
        headers
      }),
      fetch(`${COMMISSION_API}/withdrawals`, {
        headers
      })
    ]);
    
    const data = await res.json();
    
    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status}`);
    }
    
    if (!withdrawalRes.ok) {
      throw new Error('Could not load your withdrawal history.');
    }
    
    const withdrawalData = await withdrawalRes.json();
    
    const rows = Array.isArray(data.commissions)
      ? data.commissions
      : [];
    
    
    const withdrawals = Array.isArray(withdrawalData)
      ? withdrawalData
      : Array.isArray(withdrawalData.withdrawals)
        ? withdrawalData.withdrawals
        : Array.isArray(withdrawalData.data)
          ? withdrawalData.data
          : [];
    
    console.log('Withdrawal API response:', withdrawalData);
    console.log('Withdrawal records:', withdrawals);
    
    // Count withdrawals that the admin has approved.
    // Normalize status so capitalization and surrounding spaces don't matter.
    const withdrawn = withdrawals
      .filter(w => {
        const status = String(w.status || '')
          .trim()
          .toLowerCase();
    
        return ['approved', 'paid', 'completed'].includes(status);
      })
      .reduce((sum, w) => {
        const amount = Number(w.amount ?? w.withdrawalAmount ?? 0);
    
        return sum + (
          Number.isFinite(amount) && amount > 0
            ? amount
            : 0
        );
      }, 0);
    
    console.log('Calculated withdrawn total:', withdrawn);


    
    // Calculate commission totals
    const available = rows
      .filter(r => r.status === 'available')
      .reduce((sum, r) => sum + Number(r.amount || 0), 0);

    const pending = rows
      .filter(r => r.status === 'pending')
      .reduce((sum, r) => sum + Number(r.amount || 0), 0);

    // Withdrawn is calculated from approved withdrawal requests above.
    // Do not redeclare `withdrawn` here.

    // Render summary cards
    summary.innerHTML = [
      ['Records', rows.length],
      ['Available', money(available)],
      ['Pending', money(pending)],
      ['Withdrawn', money(withdrawn)]
    ].map(([label, value]) => `
      <div class="stat-card">
        <div class="stat-info">
          <h3>${esc(value)}</h3>
          <p>${esc(label)}</p>
        </div>
      </div>
    `).join('');

    msg.textContent =
      `Showing ${rows.length} record(s), newest first. This page cannot edit commissions or balances.`;

    // Empty state
    if (rows.length === 0) {
      table.innerHTML = `
        <div style="padding:18px;color:#666;background:#fff;border-radius:10px;">
          No commission records found for your account yet.
        </div>
      `;
      return;
    }

    // Render commission table
    table.innerHTML = `
      <table class="commission-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Order ID</th>
            <th>Payment ID</th>
            <th>Provider / Package</th>
            <th>Client type</th>
            <th>Selling price</th>
            <th>Original price used</th>
            <th>Commission</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          ${rows.map(r => `
            <tr>
              <td data-label="Date">
                ${esc(
                  r.createdAt
                    ? new Date(r.createdAt).toLocaleString()
                    : 'Unavailable'
                )}
              </td>

              <td data-label="Order ID">
                ${esc(r.orderId || r.sourceId)}
              </td>

              <td data-label="Payment ID">
                ${esc(
                  r.paymentTransactionId || r.gatewayTransactionId
                )}
              </td>

              <td data-label="Provider / Package">
                ${esc(
                  [r.provider, r.packageName]
                    .filter(Boolean)
                    .join(' / ') || r.description
                )}
              </td>

              <td data-label="Client type">
                ${esc(r.clientType)}
              </td>

              <td data-label="Selling price">
                ${esc(money(r.sellingPrice))}
              </td>

              <td data-label="Original price used">
                ${esc(money(r.originalPriceUsed))}
              </td>

              <td data-label="Commission">
                ${esc(money(r.creditedAmount ?? r.amount))}
              </td>

              <td data-label="Status">
                <span class="commission-status">
                  ${esc(r.status)}
                </span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

  } catch (err) {
    console.error('Commission history error:', err);

    msg.innerHTML = `
      <div class="commission-error">
        Could not load commission history: ${esc(err.message)}
      </div>
    `;

    table.innerHTML = '';
  }
}

// Refresh button
document
  .getElementById('refreshCommissions')
  .addEventListener('click', loadMyCommissions);

// Load records when the page opens
loadMyCommissions();
</script>
</body>
</html>
